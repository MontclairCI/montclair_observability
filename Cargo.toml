[package]
name = "muzanci-observability"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clickhouse = { version = "0.15.3", features = ["time", "uuid"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["local-offset", "formatting"] }
tokio = "1.54.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.23"

[lib]
name = "muzanci_observability"
path = "src/lib.rs"
